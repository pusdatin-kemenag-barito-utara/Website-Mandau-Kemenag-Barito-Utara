version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mandau-backend
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env.local

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mandau-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    depends_on:
      - backend
